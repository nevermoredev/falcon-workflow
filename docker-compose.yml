services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: falcon
      DB_USERNAME: falcon
      DB_PASSWORD: secret
    volumes:
      - ./storage/app:/var/www/html/storage/app

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: falcon
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
